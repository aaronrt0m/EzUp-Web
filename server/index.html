<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f8f6">
    <title>EzUp Upload Server</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: #172522;
        background: #f5f8f6;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 520px);
        padding: 36px;
        border: 1px solid #dce7e1;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 16px 48px #163c2a12;
      }

      .brand {
        margin: 0 0 8px;
        color: #287653;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 6vw, 36px);
        letter-spacing: -0.04em;
      }

      .description {
        margin: 12px 0 24px;
        color: #5b6b65;
        line-height: 1.6;
      }

      #status {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 24px;
        padding: 14px;
        border-radius: 8px;
        background: #eef3f0;
        font-weight: 600;
      }

      #status::before {
        width: 10px;
        height: 10px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #87958e;
        content: "";
      }

      #status[data-state="online"] {
        color: #216442;
        background: #edf7f0;
      }

      #status[data-state="online"]::before {
        background: #328657;
      }

      #status[data-state="offline"] {
        color: #9c342d;
        background: #fff1ef;
      }

      #status[data-state="offline"]::before {
        background: #bd443b;
      }

      .details {
        margin: 22px 0 0;
        color: #5b6b65;
        font-size: 14px;
        line-height: 1.8;
      }

      .details code {
        color: #172522;
      }

      @media (max-width: 480px) {
        main {
          padding: 26px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">EzUp</p>
      <h1>Upload server</h1>
      <p class="description">This service handles EzUp's resumable file uploads.</p>
      <div id="status" role="status" aria-live="polite" data-state="checking">Checking server status…</div>
      <p class="details">
        Upload endpoint: <code>/files/</code><br>
        Accepted: PNG, JPG, and WEBP up to 60 MiB; ZIP and videos are rejected.<br>
        Health check: <code>/healthz</code>
      </p>
    </main>
    <script>
      const status = document.getElementById("status");

      fetch("/healthz", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`Health check returned ${response.status}`);
          return response.text();
        })
        .then((result) => {
          if (result.trim() !== "ok") throw new Error("Unexpected health check response");
          status.dataset.state = "online";
          status.textContent = "Server is online and responding.";
        })
        .catch(() => {
          status.dataset.state = "offline";
          status.textContent = "Server is not responding. Try refreshing in a moment.";
        });
    </script>
  </body>
</html>
